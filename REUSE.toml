version = 1

[[annotations]]
path = [
  ".release.json",
  "LICENSE",
  "NOTICE",
  "biome.json",
  "package.json",
  "distribution/npm/package.json",
  "packages/*/package.json",
  "packages/*/tsconfig*.json",
  "packages/extensions/*/package.json",
  "packages/extensions/*/tsconfig*.json",
  "pnpm-lock.yaml",
  "tsconfig*.json",
]
SPDX-FileCopyrightText = "2026 Hari Srinivasan"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".agents/skills/**"]
SPDX-FileCopyrightText = "2026 Hari Srinivasan"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["packages/protocol/test/fixtures/*.json"]
SPDX-FileCopyrightText = "2026 Hari Srinivasan"
SPDX-License-Identifier = "Apache-2.0"

# Build output is disposable and inherits its source license.
[[annotations]]
path = ["packages/*/dist/**", "packages/extensions/*/dist/**"]
SPDX-FileCopyrightText = "2026 Hari Srinivasan"
SPDX-License-Identifier = "Apache-2.0"
