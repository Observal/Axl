<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="referrer" content="no-referrer" />
    <title>Axl Remote</title>
  </head>
  <body>
    <main id="remote" class="remote">
      <header class="remote-bar">
        <button id="back" type="button" class="remote-icon" aria-label="All sessions" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
        </button>
        <div class="remote-bar-text">
          <h1 id="title">Axl</h1>
          <p id="status" class="remote-status" role="status" aria-live="polite">Starting</p>
        </div>
        <span id="connection" class="remote-connection" data-state="connecting" aria-hidden="true"></span>
        <button id="refresh" type="button" class="remote-icon" aria-label="Refresh sessions" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13 8a5 5 0 1 1-1.5-3.6M13 3v2.5h-2.5" />
          </svg>
        </button>
        <button id="retry" type="button" class="remote-button" hidden>Retry</button>
      </header>

      <section id="sign-in" class="remote-panel remote-sign-in" hidden>
        <p id="sign-in-hint" class="remote-hint">Sign in to use this phone with Axl.</p>
        <button id="sign-in-button" type="button" class="remote-button">Continue with Google</button>
      </section>

      <section id="pairing" class="remote-panel" hidden>
        <ol id="steps" class="remote-steps"></ol>
        <p id="pairing-hint" class="remote-hint"></p>
      </section>

      <section id="sessions" class="remote-panel" hidden>
        <ul id="session-list" class="remote-list"></ul>
      </section>

      <section id="thread" class="remote-thread" hidden>
        <div id="transcript" class="remote-transcript">
          <div id="thread-view" class="remote-thread-view"></div>
        </div>
        <button id="jump" type="button" class="remote-jump" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5" /></svg>
          Latest
        </button>
        <form id="composer" class="remote-composer">
          <p id="activity" class="remote-activity" hidden></p>
          <div class="remote-compose-row">
            <textarea
              id="prompt"
              rows="1"
              placeholder="Message Axl"
              aria-label="Message"
              enterkeyhint="send"
            ></textarea>
            <button id="stop" type="button" class="remote-round quiet" aria-label="Stop" hidden>
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" /></svg>
            </button>
            <button id="send" type="submit" class="remote-round" aria-label="Send" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg>
            </button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="/src/remote/main.ts"></script>
  </body>
</html>
