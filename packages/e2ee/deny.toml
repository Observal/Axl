[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]
all-features = false

[advisories]
# Maintenance-only exception. This does not suppress vulnerability advisories.
# Checksum: 11ec05c52be0a07b08061f7dd003e7d7092e0472bc731b4af7bb1ef876109802
# Complete path: proc-macro-error2 2.0.1 -> hax-lib-macros 0.3.7 -> hax-lib 0.3.7
# -> libcrux-sha3 0.0.10 -> hpke-rs 0.7.0 -> openmls_libcrux_crypto 0.4.0
# Reason: exact approved OpenMLS/libcrux graph; unmaintained procedural macro, no vulnerability.
# Owner decision: Session 30 dependency approval. Expiry: 2026-12-15.
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "Maintenance-only exception for the exact approved transitive path; expires 2026-12-15; no vulnerability suppression" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Observal/secret-service-rs.git"]
