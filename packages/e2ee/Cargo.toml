[package]
name = "axl-e2ee"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace]
members = ["bindings/node"]
resolver = "2"

[dependencies]
openmls = { version = "=0.9.0", default-features = false, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0", default-features = false }
openmls_libcrux_crypto = { version = "=0.4.0", default-features = false, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0", default-features = false }
openmls_traits = { version = "=0.6.0", default-features = false }
tls_codec = { version = "=0.5.0", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redb = { version = "=4.2.0", default-features = false, features = ["std"] }
