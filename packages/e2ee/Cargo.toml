[package]
name = "axl-e2ee"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace]
members = ["bindings/node", "bindings/browser"]
resolver = "2"

[features]
browser = ["openmls/js"]
browser-test-fixtures = ["browser", "test-witness"]
node-test-fixtures = ["test-witness"]
# Deterministic in-process replica witness. Enabled only through the two test-fixture features.
test-witness = []

[dependencies]
openmls = { version = "=0.9.0", default-features = false, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0", default-features = false }
openmls_libcrux_crypto = { version = "=0.4.0", default-features = false, features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "=0.6.0", default-features = false }
openmls_traits = { version = "=0.6.0", default-features = false }
tls_codec = { version = "=0.5.0", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redb = { version = "=4.2.0", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "=0.10.1", default-features = false }
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }
security-framework-sys = { version = "=2.17.0", default-features = false, features = ["OSX_10_15"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { git = "https://github.com/Observal/secret-service-rs.git", rev = "1721451b21acfc3450be8799d92947653a5656e3", version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", default-features = false, features = ["js"] }
